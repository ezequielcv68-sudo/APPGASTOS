<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gastos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20232B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2320232B'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%238C2F39' font-family='Georgia,serif'%3E$%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1C1F26;
    --paper:#EFEBE4;
    --paper-line:#D4CECE;
    --oxblood:#8C2F39;
    --oxblood-dark:#6E232B;
    --teal:#3E6259;
    --muted:#8E897E;
    --card-bg: rgba(239, 235, 228, 0.05);
    --card-border: rgba(212, 206, 206, 0.18);
    --banamex:#D4213D;
    --bancomer:#2B5999;
    --cash:#2E7D32;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 18px 28px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  header h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:400;
    font-size:1.6rem;
    letter-spacing:0.01em;
    margin:0;
    color:var(--paper);
  }

  .status-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid var(--card-border);
    background:var(--card-bg);
    color:var(--muted);
    transition:all 0.25s ease;
  }
  .status-icon svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .status-icon.ok{
    background:rgba(78, 171, 139, 0.12);
    border-color:rgba(78, 171, 139, 0.35);
    color:#4EAB8B;
  }
  .status-icon.err{
    background:rgba(229, 83, 97, 0.12);
    border-color:rgba(229, 83, 97, 0.35);
    color:#E55361;
  }

  .amount-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .amount-label{
    font-size:0.75rem;
    color:var(--muted);
    margin-bottom:2px;
  }
  .amount-input-row{
    display:flex;
    align-items:baseline;
  }
  .amount-input-row span{
    font-family:Georgia,serif;
    font-size:1.9rem;
    color:#59544B;
    margin-right:4px;
  }
  #amount{
    flex:1;
    border:none;
    background:transparent;
    font-family:Georgia,serif;
    font-size:2.5rem;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    outline:none;
    width:100%;
    min-width:0;
  }
  #amount::placeholder{color:#C5BEB3;}

  .section-label{
    font-size:0.75rem;
    color:var(--muted);
    margin:12px 0 8px 2px;
  }

  .chip-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-bottom:8px;
  }
  .chip{
    border:1px solid var(--card-border);
    background:var(--card-bg);
    color:var(--paper);
    padding:12px 12px;
    border-radius:10px;
    font-size:0.85rem;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .chip svg{
    width:18px;
    height:18px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.8;
  }
  .chip.selected{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
    font-weight:600;
  }
  .chip.selected svg{ opacity:1; }

  .sub-chip-grid{
    display:none;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin: 6px 0 12px;
    padding: 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 1px dashed var(--card-border);
  }
  .sub-chip{
    border:1px solid var(--card-border);
    background:transparent;
    color:var(--paper);
    padding:8px 4px;
    border-radius:6px;
    font-size:0.75rem;
    text-align:center;
    cursor:pointer;
  }
  .sub-chip.selected{
    background:var(--oxblood);
    color:var(--paper);
    border-color:var(--oxblood);
    font-weight:600;
  }

  .custom-input-wrap{
    display:none;
    margin-top:6px;
    margin-bottom:12px;
  }
  .text-input{
    width: 100%;
    padding: 12px 14px;
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--paper);
    font-size: 0.9rem;
    outline: none;
  }
  .text-input:focus{ border-color:var(--paper); }
  .text-input::placeholder{ color: var(--muted); font-style: italic; }

  .payment-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    margin-bottom:20px;
  }
  .card-btn{
    padding:12px 10px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--card-bg);
    color:var(--paper);
    font-size:0.82rem;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:8px;
    transition:all 0.15s ease;
  }
  .card-btn .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .card-btn[data-card*="Banamex"] .dot{background:var(--banamex);}
  .card-btn[data-card*="BBVA"] .dot{background:var(--bancomer);}
  .card-btn[data-card="Efectivo"] .dot{background:var(--cash);}
  .card-btn.selected{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600;}

  #registrar{
    width:100%;
    padding:15px;
    background:var(--oxblood);
    color:var(--paper);
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
    margin-bottom:12px;
    box-shadow: 0 4px 12px rgba(140, 47, 57, 0.3);
    transition: background 0.15s ease;
  }
  #registrar:active{background:var(--oxblood-dark);}
  #registrar:disabled{background:rgba(255,255,255,0.1);color:var(--muted);box-shadow:none;cursor:not-allowed;}

  .cancel-edit-btn{
    width:100%;
    padding:10px;
    background:transparent;
    color:var(--muted);
    border:1px dashed var(--card-border);
    border-radius:10px;
    font-size:0.85rem;
    cursor:pointer;
    margin-bottom:24px;
  }

  .period-tabs{
    display:flex;
    gap:6px;
    margin-top:10px;
    margin-bottom:12px;
    background:rgba(255,255,255,0.03);
    padding:4px;
    border-radius:10px;
    border:1px solid var(--card-border);
  }
  .period-btn{
    flex:1;
    padding:8px 0;
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:0.8rem;
    font-weight:500;
    border-radius:6px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .period-btn.active{
    background:var(--paper);
    color:var(--ink);
    font-weight:600;
  }

  .day-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-top:1px solid rgba(255,255,255,0.08);
    padding-top:14px;
    margin-bottom:10px;
  }
  .day-total .label{font-size:0.85rem;color:var(--muted);}
  .day-total .value{font-family:Georgia,serif;font-size:1.35rem;font-variant-numeric:tabular-nums;}

  .ledger{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px dashed rgba(255,255,255,0.08);
    font-size:0.9rem;
  }
  .row .left{display:flex;flex-direction:column;gap:2px;}
  .row .cat{color:var(--paper);font-weight:500;}
  .row .meta{font-size:0.72rem;color:var(--muted);}
  .row .right-side{display:flex;align-items:center;gap:8px;}
  .row .amt{font-family:Georgia,serif;font-variant-numeric:tabular-nums;font-size:1rem;margin-right:4px;}
  .row .edit-btn, .row .del-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
    border-radius:3px;
  }
  .row .edit-btn:hover{color:var(--paper);}
  .row .del-btn:hover{color:var(--oxblood);}
  .row .pending{color:var(--muted);font-style:italic;font-size:0.72rem;}
  .empty{color:var(--muted);font-size:0.85rem;padding:16px 0;text-align:center;}

  .setup{
    background:var(--paper);
    color:var(--ink);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    font-size:0.85rem;
    line-height:1.5;
  }
  .setup h2{font-size:0.95rem;margin:0 0 8px;font-family:Georgia,serif;font-weight:400;}
  .setup label{display:block;font-size:0.72rem;color:var(--muted);margin-top:10px;margin-bottom:3px;}
  .setup input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    font-size:0.85rem;
    background:#fff;
  }
  .setup .btnrow{display:flex;gap:8px;margin-top:14px;}
  .setup button{
    padding:10px 14px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-size:0.82rem;
    cursor:pointer;
  }
  .setup button.secondary{background:transparent;color:var(--ink);}
  .toggle-setup{
    background:none;border:none;color:var(--muted);font-size:0.75rem;
    text-decoration:underline;cursor:pointer;padding:0;margin-bottom:14px;align-self:flex-start;
  }

  /* ========== ESTILOS VENTANA EMERGENTE (MODAL) ========== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 12, 16, 0.7);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-box {
    background: var(--ink);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    width: 85%;
    max-width: 320px;
    transform: translateY(20px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-overlay.active .modal-box {
    transform: translateY(0) scale(1);
  }
  .modal-title {
    color: var(--paper);
    font-family: Georgia, serif;
    font-size: 1.3rem;
    margin: 0 0 10px;
  }
  .modal-body {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .modal-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .modal-btn.cancel {
    background: rgba(255,255,255,0.05);
    color: var(--paper);
  }
  .modal-btn.cancel:active { background: rgba(255,255,255,0.1); }
  
  .modal-btn.confirm {
    background: var(--oxblood);
    color: var(--paper);
  }
  .modal-btn.confirm:active { background: var(--oxblood-dark); }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Gastos</h1>
    <div id="statusIcon" class="status-icon err" title="sin conectar">
      <svg viewBox="0 0 24 24"><path d="m2 2 20 20M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.956-.445M20.177 16.177A4.5 4.5 0 0 0 17.5 10h-1.79a7.008 7.008 0 0 0-10.748-2.782"/></svg>
    </div>
  </header>

  <button class="toggle-setup" id="toggleSetup">configurar conexión con Google</button>

  <div class="setup" id="setup" style="display:none;">
    <h2>Conexión con Google Sheets</h2>
    <p>Ingresa tu Client ID y el ID de tu hoja de Google Sheets.</p>
    <label>Client ID de Google</label>
    <input id="clientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com">
    <label>ID de la hoja de cálculo (Spreadsheet ID)</label>
    <input id="sheetIdInput" placeholder="1AbC...xyz (de la URL del Sheet)">
    <label>Nombre de la pestaña</label>
    <input id="sheetTabInput" placeholder="Gastos" value="Gastos">
    <div class="btnrow">
      <button id="saveConfig">Guardar</button>
      <button class="secondary" id="connectGoogle">Conectar cuenta</button>
    </div>
  </div>

  <div class="amount-card">
    <div class="amount-label">Monto</div>
    <div class="amount-input-row">
      <span>$</span>
      <input id="amount" type="number" inputmode="decimal" placeholder="0.00">
    </div>
  </div>

  <div class="section-label">Categoría</div>
  <div class="chip-grid" id="catGrid">
    <button class="chip" data-cat="Gasolina">
      <svg viewBox="0 0 24 24"><path d="M3 22V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v17M13 10h4l3 3v6a1 1 0 0 1-2 0v-4M3 22h10"/></svg>
      Gasolina
    </button>
    <button class="chip" data-cat="Comida">
      <svg viewBox="0 0 24 24"><path d="M18 8v11M6 3v8M10 3v8M6 8h4M14 3v4a4 4 0 0 1-4 4"/></svg>
      Comida
    </button>
    <button class="chip" data-cat="Súper">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Súper
    </button>
    <button class="chip" data-cat="Gastos médicos">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
      Gastos médicos
    </button>
    <button class="chip" data-cat="Servicios">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Servicios
    </button>
    <button class="chip" data-cat="Otros">
      <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Otros
    </button>
  </div>

  <div class="sub-chip-grid" id="subComidaWrap">
    <button class="sub-chip" data-sub="Desayuno">Desayuno</button>
    <button class="sub-chip" data-sub="Comida">Comida</button>
    <button class="sub-chip" data-sub="Cena">Cena</button>
  </div>

  <div class="sub-chip-grid" id="subServiciosWrap">
    <button class="sub-chip" data-sub="Luz">Luz</button>
    <button class="sub-chip" data-sub="Agua">Agua</button>
    <button class="sub-chip" data-sub="Internet">Internet</button>
    <button class="sub-chip" data-sub="Gas">Gas</button>
    <button class="sub-chip" data-sub="Teléfono">Teléfono</button>
    <button class="sub-chip" data-sub="Mantenimiento">Mantenimiento</button>
  </div>

  <div class="custom-input-wrap" id="customInputWrap">
    <input id="customCategory" class="text-input" type="text" placeholder="Describe el gasto (ej. Cine, Farmacia...)">
  </div>

  <div class="section-label">Método de Pago</div>
  <div class="payment-grid" id="cardRow">
    <button class="card-btn" data-card="Banamex Oro"><span class="dot"></span>Banamex Oro</button>
    <button class="card-btn" data-card="Banamex Costco"><span class="dot"></span>Banamex Costco</button>
    <button class="card-btn" data-card="Banamex Nómina"><span class="dot"></span>Banamex Nómina</button>
    <button class="card-btn" data-card="BBVA Platinum"><span class="dot"></span>BBVA Platinum</button>
    <button class="card-btn" data-card="Efectivo" style="grid-column: span 2;"><span class="dot"></span>Efectivo</button>
  </div>

  <button id="registrar" disabled>Registrar gasto</button>
  <button id="cancelEdit" class="cancel-edit-btn" style="display:none;">Cancelar edición</button>

  <!-- Pestañas de Período -->
  <div class="period-tabs">
    <button class="period-btn active" data-period="hoy">Hoy</button>
    <button class="period-btn" data-period="semana">Semana</button>
    <button class="period-btn" data-period="mes">Mes</button>
  </div>

  <div class="day-total">
    <span class="label" id="periodLabel">Hoy</span>
    <span class="value" id="dayTotal">$0.00</span>
  </div>

  <div class="ledger" id="ledger">
    <div class="empty">Todavía no registras gastos hoy.</div>
  </div>

</div>

<!-- ========== ESTRUCTURA DEL MODAL ========== -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <h3 class="modal-title" id="modalTitle">Atención</h3>
    <p class="modal-body" id="modalBody">¿Estás seguro de continuar?</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">Cancelar</button>
      <button class="modal-btn confirm" id="modalConfirm">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const SCOPE = "https://www.googleapis.com/auth/spreadsheets";
let state = {
  config: JSON.parse(localStorage.getItem("gastos_config") || "{}"),
  accessToken: null,
  tokenClient: null,
  mainCategory: null,
  subCategory: null,
  card: null,
  sheetGid: null,
  editingIndex: null,
  viewPeriod: "hoy", 
  sheetRows: [],     
  todayRows: JSON.parse(localStorage.getItem("gastos_today") || "[]"),
};

// ---------- Lógica de Ventana Emergente (Modal) ----------
function showConfirmModal(title, message, confirmText = "Eliminar") {
  return new Promise((resolve) => {
    const modal = document.getElementById("customModal");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").textContent = message;
    
    const btnCancel = document.getElementById("modalCancel");
    const btnConfirm = document.getElementById("modalConfirm");
    btnConfirm.textContent = confirmText;
    
    modal.classList.add("active");

    const cleanup = () => {
      modal.classList.remove("active");
      btnCancel.removeEventListener("click", onCancel);
      btnConfirm.removeEventListener("click", onConfirm);
    };

    const onCancel = () => { cleanup(); resolve(false); };
    const onConfirm = () => { cleanup(); resolve(true); };

    btnCancel.addEventListener("click", onCancel);
    btnConfirm.addEventListener("click", onConfirm);
  });
}

// ---------- Config UI ----------
const setupEl = document.getElementById("setup");
document.getElementById("toggleSetup").onclick = () => {
  setupEl.style.display = setupEl.style.display === "none" ? "block" : "none";
};
document.getElementById("clientIdInput").value = state.config.clientId || "";
document.getElementById("sheetIdInput").value = state.config.sheetId || "";
document.getElementById("sheetTabInput").value = state.config.sheetTab || "Gastos";

document.getElementById("saveConfig").onclick = () => {
  state.config = {
    clientId: document.getElementById("clientIdInput").value.trim(),
    sheetId: document.getElementById("sheetIdInput").value.trim(),
    sheetTab: document.getElementById("sheetTabInput").value.trim() || "Gastos",
  };
  localStorage.setItem("gastos_config", JSON.stringify(state.config));
  initGoogle();
  setupEl.style.display = "none";
};

document.getElementById("connectGoogle").onclick = () => {
  if (!state.tokenClient) { initGoogle(); }
  if (state.tokenClient) state.tokenClient.requestAccessToken({prompt: "consent"});
};

function setStatus(mode, text){
  const statusContainer = document.getElementById("statusIcon");
  statusContainer.title = text;

  if (mode === "ok") {
    statusContainer.className = "status-icon ok";
    statusContainer.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;
  } else {
    statusContainer.className = "status-icon err";
    statusContainer.innerHTML = `<svg viewBox="0 0 24 24"><path d="m2 2 20 20M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.956-.445M20.177 16.177A4.5 4.5 0 0 0 17.5 10h-1.79a7.008 7.008 0 0 0-10.748-2.782"/></svg>`;
  }
}

function initGoogle(){
  if (!state.config.clientId) { setStatus("err", "falta configurar"); return; }
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 300); return; }
  state.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: state.config.clientId,
    scope: SCOPE,
    callback: async (resp) => {
      if (resp.access_token){
        state.accessToken = resp.access_token;
        setStatus("ok", "conectado");
        await flushPending();
        if (state.viewPeriod !== "hoy") await fetchAllSheetRows();
      } else {
        setStatus("err", "error de conexión");
      }
    },
  });
  setStatus("err", "listo para conectar");
  if (state.config.clientId && !state.accessToken) {
    state.tokenClient.requestAccessToken({prompt: ''});
  }
}
window.addEventListener("load", () => setTimeout(initGoogle, 300));

async function fetchSheetGid() {
  if (!state.accessToken || state.sheetGid !== null) return state.sheetGid;
  try {
    const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}?fields=sheets.properties`, {
      headers: { "Authorization": `Bearer ${state.accessToken}` }
    });
    const data = await res.json();
    const sheet = data.sheets.find(s => s.properties.title === state.config.sheetTab);
    if (sheet) state.sheetGid = sheet.properties.sheetId;
    return state.sheetGid || 0;
  } catch(e) {
    console.error(e);
    return 0;
  }
}

async function fetchAllSheetRows() {
  if (!state.accessToken || !state.config.sheetId) return;
  try {
    const tabName = state.config.sheetTab || "Gastos";
    const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${encodeURIComponent(tabName)}!A:E`, {
      headers: { "Authorization": `Bearer ${state.accessToken}` }
    });
    if (res.ok) {
      const data = await res.json();
      state.sheetRows = data.values || [];
      renderLedger();
    }
  } catch(e) {
    console.error("Error al cargar historial completo:", e);
  }
}

document.querySelectorAll(".period-btn").forEach(btn => {
  btn.addEventListener("click", async (e) => {
    document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.viewPeriod = btn.dataset.period;

    const labels = { hoy: "Hoy", semana: "Esta Semana", mes: "Este Mes" };
    document.getElementById("periodLabel").textContent = labels[state.viewPeriod];

    if (state.viewPeriod !== "hoy") {
      await fetchAllSheetRows();
    } else {
      renderLedger();
    }
  });
});

function parseMXDate(str) {
  if (!str) return null;
  const parts = str.split('/');
  if (parts.length !== 3) return null;
  return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
}

function isSameWeek(d1, d2) {
  const getMonday = (d) => {
    const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff)).getTime();
  };
  return getMonday(d1) === getMonday(d2);
}

function isSameMonth(d1, d2) {
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
}

const catInput = document.getElementById("customCategory");
const customWrap = document.getElementById("customInputWrap");
const subComidaWrap = document.getElementById("subComidaWrap");
const subServiciosWrap = document.getElementById("subServiciosWrap");

document.getElementById("catGrid").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("selected"));
  btn.classList.add("selected");
  
  state.mainCategory = btn.dataset.cat;
  state.subCategory = null;
  document.querySelectorAll(".sub-chip").forEach(s => s.classList.remove("selected"));

  subComidaWrap.style.display = "none";
  subServiciosWrap.style.display = "none";
  customWrap.style.display = "none";
  catInput.value = "";

  if (state.mainCategory === "Comida") {
    subComidaWrap.style.display = "grid";
  } else if (state.mainCategory === "Servicios") {
    subServiciosWrap.style.display = "grid";
  } else if (state.mainCategory === "Otros") {
    customWrap.style.display = "block";
    catInput.focus();
  }
  checkReady();
});

[subComidaWrap, subServiciosWrap].forEach(wrap => {
  wrap.addEventListener("click", (e) => {
    const btn = e.target.closest(".sub-chip");
    if (!btn) return;
    wrap.querySelectorAll(".sub-chip").forEach(s => s.classList.remove("selected"));
    btn.classList.add("selected");
    state.subCategory = btn.dataset.sub;
    checkReady();
  });
});

catInput.addEventListener("input", checkReady);

document.getElementById("cardRow").addEventListener("click", (e) => {
  const btn = e.target.closest(".card-btn");
  if (!btn) return;
  document.querySelectorAll(".card-btn").forEach(c => c.classList.remove("selected"));
  btn.classList.add("selected");
  state.card = btn.dataset.card;
  checkReady();
});

document.getElementById("amount").addEventListener("input", checkReady);

function checkReady(){
  const amt = parseFloat(document.getElementById("amount").value);
  let catValid = false;

  if (state.mainCategory === "Comida" || state.mainCategory === "Servicios") {
    catValid = state.subCategory !== null;
  } else if (state.mainCategory === "Otros") {
    catValid = catInput.value.trim().length > 0;
  } else {
    catValid = state.mainCategory !== null;
  }
  document.getElementById("registrar").disabled = !(amt > 0 && catValid && state.card);
}

document.getElementById("registrar").onclick = async () => {
  const amt = parseFloat(document.getElementById("amount").value);
  let finalCat = state.mainCategory;

  if (state.mainCategory === "Comida" || state.mainCategory === "Servicios") {
    finalCat = `${state.mainCategory} (${state.subCategory})`;
  } else if (state.mainCategory === "Otros") {
    finalCat = catInput.value.trim();
  }

  const now = new Date();

  if (state.editingIndex !== null) {
    const oldEntry = { ...state.todayRows[state.editingIndex] };
    const updatedEntry = {
      ...oldEntry,
      tipoGasto: finalCat,
      monto: amt,
      tarjeta: state.card,
    };

    state.todayRows[state.editingIndex] = updatedEntry;
    persistToday();
    renderLedger();
    resetForm();
    await updateInSheets(oldEntry, updatedEntry);
  } else {
    const entry = {
      fecha: now.toLocaleDateString("es-MX"),
      hora: now.toLocaleTimeString("es-MX", {hour:'2-digit', minute:'2-digit'}),
      tipoGasto: finalCat,
      monto: amt,
      tarjeta: state.card,
      synced: false,
    };
    state.todayRows.unshift(entry);
    persistToday();
    renderLedger();
    resetForm();
    await trySync(entry);
  }

  if (state.viewPeriod !== "hoy") await fetchAllSheetRows();
};

document.getElementById("cancelEdit").onclick = () => {
  resetForm();
};

function resetForm(){
  document.getElementById("amount").value = "";
  catInput.value = "";
  customWrap.style.display = "none";
  subComidaWrap.style.display = "none";
  subServiciosWrap.style.display = "none";
  document.querySelectorAll(".chip, .sub-chip, .card-btn").forEach(c => c.classList.remove("selected"));
  state.mainCategory = null;
  state.subCategory = null;
  state.card = null;
  state.editingIndex = null;
  document.getElementById("registrar").textContent = "Registrar gasto";
  document.getElementById("cancelEdit").style.display = "none";
  document.getElementById("registrar").disabled = true;
}

function persistToday(){
  const todayStr = new Date().toLocaleDateString("es-MX");
  state.todayRows = state.todayRows.filter(r => r.fecha === todayStr);
  localStorage.setItem("gastos_today", JSON.stringify(state.todayRows));
}

function getFilteredRows() {
  if (state.viewPeriod === "hoy") {
    return state.todayRows.map((r, index) => ({ ...r, localIndex: index }));
  }
  const now = new Date();
  const filtered = [];
  for (let i = 1; i < state.sheetRows.length; i++) {
    const row = state.sheetRows[i];
    if (!row || row.length < 4) continue;
    const rDate = parseMXDate(row[0]);
    if (!rDate) continue;

    let isMatch = false;
    if (state.viewPeriod === "semana" && isSameWeek(rDate, now)) {
      isMatch = true;
    } else if (state.viewPeriod === "mes" && isSameMonth(rDate, now)) {
      isMatch = true;
    }

    if (isMatch) {
      filtered.push({
        fecha: row[0],
        hora: row[1],
        tipoGasto: row[2],
        monto: parseFloat(row[3]) || 0,
        tarjeta: row[4] || "",
        synced: true,
      });
    }
  }
  return filtered.reverse();
}

function renderLedger(){
  const ledger = document.getElementById("ledger");
  const rows = getFilteredRows();

  if (rows.length === 0){
    const txt = state.viewPeriod === "hoy" ? "hoy" : (state.viewPeriod === "semana" ? "esta semana" : "este mes");
    ledger.innerHTML = `<div class="empty">Todavía no hay gastos en ${txt}.</div>`;
  } else {
    ledger.innerHTML = rows.map((r) => {
      const nombreGasto = r.tipoGasto || r.categoria || "Gasto";
      const isHoy = state.viewPeriod === "hoy";
      const actions = isHoy ? `
        <button class="edit-btn" onclick="editEntry(${r.localIndex})" title="Editar gasto">✏️</button>
        <button class="del-btn" onclick="deleteEntry(${r.localIndex})" title="Eliminar gasto">&times;</button>
      ` : `<span class="meta">${r.fecha}</span>`;

      return `
      <div class="row">
        <div class="left">
          <span class="cat">${nombreGasto}</span>
          <span class="meta">${r.hora} · ${r.tarjeta}${r.synced ? "" : " · <span class='pending'>pendiente de guardar</span>"}</span>
        </div>
        <div class="right-side">
          <span class="amt">$${r.monto.toFixed(2)}</span>
          ${actions}
        </div>
      </div>`;
    }).join("");
  }
  const total = rows.reduce((s, r) => s + r.monto, 0);
  document.getElementById("dayTotal").textContent = "$" + total.toFixed(2);
}

window.editEntry = function(index) {
  const entry = state.todayRows[index];
  if (!entry) return;

  state.editingIndex = index;
  document.getElementById("amount").value = entry.monto;

  document.querySelectorAll(".chip, .sub-chip, .card-btn").forEach(c => c.classList.remove("selected"));
  subComidaWrap.style.display = "none";
  subServiciosWrap.style.display = "none";
  customWrap.style.display = "none";

  const catStr = entry.tipoGasto || entry.categoria || "";
  if (catStr.startsWith("Comida (")) {
    state.mainCategory = "Comida";
    const sub = catStr.replace("Comida (", "").replace(")", "");
    state.subCategory = sub;
    subComidaWrap.style.display = "grid";
    highlightChip("Comida");
    highlightSubChip(subComidaWrap, sub);
  } else if (catStr.startsWith("Servicios (")) {
    state.mainCategory = "Servicios";
    const sub = catStr.replace("Servicios (", "").replace(")", "");
    state.subCategory = sub;
    subServiciosWrap.style.display = "grid";
    highlightChip("Servicios");
    highlightSubChip(subServiciosWrap, sub);
  } else if (["Gasolina", "Comida", "Súper", "Gastos médicos", "Servicios"].includes(catStr)) {
    state.mainCategory = catStr;
    highlightChip(catStr);
  } else {
    state.mainCategory = "Otros";
    highlightChip("Otros");
    customWrap.style.display = "block";
    catInput.value = catStr;
  }

  state.card = entry.tarjeta;
  highlightCard(entry.tarjeta);

  document.getElementById("registrar").textContent = "Guardar cambios";
  document.getElementById("cancelEdit").style.display = "block";

  checkReady();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function highlightChip(catName) {
  document.querySelectorAll("#catGrid .chip").forEach(c => {
    if (c.dataset.cat === catName) c.classList.add("selected");
  });
}
function highlightSubChip(wrap, subName) {
  wrap.querySelectorAll(".sub-chip").forEach(s => {
    if (s.dataset.sub === subName) s.classList.add("selected");
  });
}
function highlightCard(cardName) {
  document.querySelectorAll("#cardRow .card-btn").forEach(c => {
    if (c.dataset.card === cardName) c.classList.add("selected");
  });
}

window.deleteEntry = async function(index){
  const entry = state.todayRows[index];
  if (!entry) return;
  
  const isConfirmed = await showConfirmModal(
    "Eliminar Gasto", 
    "¿Seguro que deseas eliminar este gasto permanentemente? Se borrará de tu teléfono y de Google Sheets."
  );

  if (isConfirmed) {
    state.todayRows.splice(index, 1);
    persistToday();
    renderLedger();
    await deleteFromSheets(entry);
    if (state.viewPeriod !== "hoy") await fetchAllSheetRows();
  }
};

async function updateInSheets(oldEntry, newEntry) {
  if (!state.accessToken) {
    if (state.tokenClient) state.tokenClient.requestAccessToken({prompt: ''});
    setStatus("err", "sin sesión activa");
    return;
  }
  setStatus("err", "actualizando...");
  try {
    const tabName = state.config.sheetTab || "Gastos";
    const getUrl = `https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${encodeURIComponent(tabName)}!A:E`;
    const resGet = await fetch(getUrl, {
      headers: { "Authorization": `Bearer ${state.accessToken}` }
    });
    
    if (!resGet.ok) throw new Error("No se pudo leer la hoja");
    const dataGet = await resGet.json();
    const rows = dataGet.values || [];

    let targetRow = -1;
    for (let i = rows.length - 1; i >= 0; i--) {
      const r = rows[i];
      if (r && r[0] == oldEntry.fecha && r[1] == oldEntry.hora && parseFloat(r[3]) == parseFloat(oldEntry.monto)) {
        targetRow = i + 1;
        break;
      }
    }

    if (targetRow === -1) {
      await trySync(newEntry);
      return;
    }

    const updateUrl = `https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${encodeURIComponent(tabName)}!A${targetRow}:E${targetRow}?valueInputOption=USER_ENTERED`;
    const resUpdate = await fetch(updateUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${state.accessToken}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        values: [[newEntry.fecha, newEntry.hora, newEntry.tipoGasto, newEntry.monto, newEntry.tarjeta]]
      })
    });

    if (!resUpdate.ok) throw new Error("Error al actualizar");
    newEntry.synced = true;
    persistToday();
    renderLedger();
    setStatus("ok", "actualizado en Sheets");
  } catch(e) {
    console.error("Error al actualizar en Sheets:", e);
    setStatus("err", "error al actualizar en Sheets");
  }
}

async function deleteFromSheets(entry) {
  if (!state.accessToken) {
    if (state.tokenClient) state.tokenClient.requestAccessToken({prompt: ''});
    setStatus("err", "sin sesión activa");
    return;
  }
  setStatus("err", "eliminando...");
  try {
    const tabName = state.config.sheetTab || "Gastos";
    const getUrl = `https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${encodeURIComponent(tabName)}!A:E`;
    const resGet = await fetch(getUrl, {
      headers: { "Authorization": `Bearer ${state.accessToken}` }
    });
    
    if (!resGet.ok) throw new Error("No se pudo leer la hoja");
    const dataGet = await resGet.json();
    const rows = dataGet.values || [];

    let targetRow = -1;
    for (let i = rows.length - 1; i >= 0; i--) {
      const r = rows[i];
      if (r && r[0] == entry.fecha && r[1] == entry.hora && parseFloat(r[3]) == parseFloat(entry.monto)) {
        targetRow = i + 1;
        break;
      }
    }

    if (targetRow === -1) {
      setStatus("err", "no se encontró el registro en Sheets");
      return;
    }

    const gid = await fetchSheetGid();
    const batchUrl = `https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}:batchUpdate`;
    const resDel = await fetch(batchUrl, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${state.accessToken}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        requests: [{
          deleteDimension: {
            range: {
              sheetId: gid || 0,
              dimension: "ROWS",
              startIndex: targetRow - 1,
              endIndex: targetRow
            }
          }
        }]
      })
    });

    if (!resDel.ok) throw new Error("Error en eliminación");
    setStatus("ok", "eliminado de Sheets");
  } catch(e) {
    console.error("Error al borrar en Sheets:", e);
    setStatus("err", "error al borrar en Sheets");
  }
}

renderLedger();

async function trySync(entry){
  if (!state.accessToken){
    setStatus("err", state.config.clientId ? "sin sesión: toca conectar" : "falta configurar");
    return;
  }
  const range = encodeURIComponent(`${state.config.sheetTab}!A:E`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${range}:append?valueInputOption=USER_ENTERED`;
  try{
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${state.accessToken}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        values: [[entry.fecha, entry.hora, entry.tipoGasto, entry.monto, entry.tarjeta]],
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    entry.synced = true;
    persistToday();
    renderLedger();
    setStatus("ok", "guardado en Sheets");
  } catch(err){
    setStatus("err", "no se pudo guardar, reintenta");
    console.error(err);
  }
}

async function flushPending(){
  const pending = state.todayRows.filter(r => !r.synced);
  for (const entry of pending){
    await trySync(entry);
  }
}

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
